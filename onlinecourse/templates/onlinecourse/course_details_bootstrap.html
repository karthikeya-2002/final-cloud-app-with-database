<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <title>Course Details - {{ course.name }}</title>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <a class="navbar-brand" href="#">Online Course Portal</a>
    </nav>

    <div class="container mt-5">
        <div class="row mb-4">
            <div class="col-12">
                <h1 class="text-center text-primary">{{ course.name }}</h1>
                <hr>
            </div>
        </div>

        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-dark text-white">
                        <h4 class="mb-0">Course Lessons</h4>
                    </div>
                    <div class="card-body">
                        <div class="list-group">
                            {% for lesson in course.lesson_set.all %}
                                <div class="list-group-item list-group-item-action flex-column align-items-start mb-2 border">
                                    <div class="d-flex w-100 justify-content-between">
                                        <h5 class="mb-1 text-info">{{ lesson.title }}</h5>
                                    </div>
                                    <p class="mb-1">{{ lesson.content }}</p>
                                </div>
                            {% empty %}
                                <div class="alert alert-warning" role="alert">
                                    No lessons are currently available for this course.
                                </div>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
</body>
</html>
